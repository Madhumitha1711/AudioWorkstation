<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Elements of the Recording Space — Horizontal (Studio VR)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  DESIGN MOCKUP — ALTERNATE, HORIZONTAL layout for the "Key Elements of the
  Recording Space" lab (kind "studio-components-lab",
  interactives/foundations/StudioComponentsLab). Same 16 components and copy
  as the current lab — the data block below is generated verbatim from
  studioComponentsData.js, so nothing is reworded.

  What changes vs. design/studio-components-chapter.html (vertical
  master/detail with a 340px accordion rail on the left):

    ROW 1  Section tabs — the app-wide STANDARD Tabs, variant="underline"
           (lesson/lab content navigation). Four tabs, one per section,
           rendered with renderTab as two lines: room (small caps) over
           "Electronic" (no numbers). Built-in explored dots + "N/4 explored" count.
    ROW 2  Component rail — the same standard Tabs, variant="segmented"
           size="sm", listing the 4 components of the active section with
           their icon (renderTab). Explored state is controlled per section
           (pass `visited`), so the dots/count mean "components opened".
    ROW 3  <TabPanel> — photo on top, text below it.
    ROW 4  Pager — prev/next across all 16, crossing section boundaries
           (moves both tab bars).

  Tabs rules followed (CLAUDE.md "Tabs standard"): the .ui-tabs__* CSS
  below is copied verbatim from src/components/Tabs/Tabs.css and is NOT
  restyled; indicator + active pill use --brand-accent (theme primary);
  section tone colours (--scl-*) appear only in content (numbers, icons,
  bullets), never on the tab indicator. Motion uses the global tokens:
  indicator glides (transform + width, --motion-tab-duration), panel fades
  + slides 10px in the direction of travel while its height eases
  (--motion-panel-duration). All off under prefers-reduced-motion.

  Fonts: Inter (--font-sans) + JetBrains Mono (--font-mono) only.
  Theme: course tokens (.svr-course) for dark/light; the bar at the very
  top is mockup-only (theme + palette switch) and is not part of the lab.

  Implementation sketch (React):
    <Tabs items={SECTIONS.map(s => ({ id: s.n, label: s.type }))}
          value={section.n} onChange={pickSection} ariaLabel="Studio areas"
          idPrefix="scl-sec" renderTab={(it) => <SectionTab s={...} />} />
    <Tabs variant="segmented" size="sm" items={section.items.map(...)}
          value={item.id} onChange={select} visited={viewedIn(section)}
          ariaLabel={`${section.room} — ${section.type}`} idPrefix="scl-item"
          renderTab={(it) => <><Icon id={it.id}/>{it.label}</>} />
    <TabPanel idPrefix="scl-item" value={item.id} index={flatIndex}>…</TabPanel>
  Images: public/studio-components/<id>.jpg (placeholder until present).
-->
<style>
  /* ---------- global tokens (src/index.css) ---------- */
  :root{
    --font-sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ink-tint-rgb:4, 20, 12;
    --motion-ease-out:cubic-bezier(0.16, 1, 0.3, 1);
    --motion-fast:180ms;
    --motion-medium:260ms;
    --motion-tab-duration:480ms;
    --motion-panel-duration:440ms;
    --motion-panel-shift:10px;
    --brand-accent:#7dffb8;   /* primary   — set by the palette switch */
    --brand-accent-2:#17c76a; /* secondary — set by the palette switch */
  }
  @media (prefers-reduced-motion: reduce){
    :root{ --motion-tab-duration:0ms; --motion-panel-duration:0ms; }
  }

  /* ---------- course theme tokens (CoursePage.css .svr-course) ---------- */
  .svr-course{
    --bg:#050507;
    --panel:rgba(255,255,255,0.04);
    --panel-hover:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.12);
    --border-soft:rgba(255,255,255,0.08);
    --text:#ffffff;
    --text-dim:rgba(255,255,255,0.65);
    --text-dimmer:rgba(255,255,255,0.45);
    --accent:var(--brand-accent);
  }
  :root[data-theme='light'] .svr-course{
    --bg:#f6f8f6;
    --panel:rgba(var(--ink-tint-rgb),0.04);
    --panel-hover:rgba(var(--ink-tint-rgb),0.07);
    --border:rgba(var(--ink-tint-rgb),0.14);
    --border-soft:rgba(var(--ink-tint-rgb),0.09);
    --text:#0c130f;
    --text-dim:rgba(12,19,15,0.7);
    --text-dimmer:rgba(12,19,15,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{font:16px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased;}
  button{font:inherit; color:inherit;}

  /* ---------- mockup-only switch bar (not part of the lab) ---------- */
  .mock-bar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 16px; font:500 11px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase;
    background:#111114; color:#9a9aa2; border-bottom:1px solid #26262b;
  }
  .mock-bar b{color:#e6e6ea; font-weight:600;}
  .mock-bar .sp{flex:1;}
  .mock-bar button,.mock-bar select{
    font:500 11px/1 var(--font-mono); letter-spacing:.06em; text-transform:uppercase;
    background:#1b1b20; color:#e6e6ea; border:1px solid #2e2e35; border-radius:6px; padding:6px 9px; cursor:pointer;
  }

  /* ---------- page shell (stands in for the course content column) ---------- */
  .svr-course{background:var(--bg); color:var(--text); min-height:100vh;}
  .course-col{max-width:1120px; margin:0 auto; padding:40px 28px 72px;}
  .lesson-eyebrow{font-size:12px; font-weight:600; line-height:1; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:12px;}
  .lesson-h{font-size:clamp(24px,3.4vw,30px); font-weight:600; letter-spacing:-.015em; line-height:1.2; margin:0 0 8px;}
  .lesson-sub{font-size:15px; line-height:1.6; color:var(--text-dim); margin:0 0 28px; max-width:70ch;}

  /* ======================================================================
     STANDARD TABS — verbatim copy of src/components/Tabs/Tabs.css
     ====================================================================== */
/* Standard tabs (see Tabs.jsx + CLAUDE.md "Tabs standard").

   Re-skin per feature by setting these tokens on any ancestor (or on the
   component via `className`) — never by restyling .ui-tabs__* rules:
     --tabs-accent         underline / active accent
     --tabs-text           idle label color
     --tabs-text-active    active + hover label color
     --tabs-line           baseline under an underline bar
     --tabs-track-bg       segmented: track background
     --tabs-track-border   segmented: track border
     --tabs-thumb-bg       segmented: sliding pill background
     --tabs-thumb-border   segmented: sliding pill border
     --tabs-thumb-text     segmented: active label color
     --tabs-dot            "explored" dot + count number colour (default: theme primary)
     --tabs-count-text     "N/M explored" label colour
     --tabs-font           defaults to the global --font-sans
     --tabs-font-size / --tabs-weight / --tabs-letter-spacing / --tabs-transform
   Colour: by default the indicator (underline / segmented pill) and the
   active segmented label use the THEME PRIMARY colour, --brand-accent
   (src/theme/palettes.js via PaletteContext), so every tab set follows the
   selected palette and light/dark automatically. Features should NOT
   override --tabs-accent / --tabs-thumb-* with their own colours.
   Timing comes from the global motion tokens in index.css (--motion-*).
   Defaults fall back to the course tokens (--text, --text-dim, --border)
   and then the app-shell tokens, so tabs look right with no setup. */

.ui-tabs {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  min-width: 0;
}

.ui-tabs__list {
  position: relative;
  display: flex;
  gap: 4px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  isolation: isolate;
}
.ui-tabs__list::-webkit-scrollbar { display: none; }

.ui-tabs__tab {
  position: relative;
  z-index: 1;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 0;
  padding: var(--tabs-pad-y, 12px) var(--tabs-pad-x, 14px);
  background: none;
  border: 0;
  border-radius: 6px;
  color: var(--tabs-text, var(--text-dim, var(--shell-text-dim)));
  font-family: var(--tabs-font, var(--font-sans));
  font-size: var(--tabs-font-size, 14px);
  font-weight: var(--tabs-weight, 500);
  letter-spacing: var(--tabs-letter-spacing, 0);
  text-transform: var(--tabs-transform, none);
  line-height: 1.25;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color var(--motion-medium, 260ms) var(--motion-ease-out, ease);
}
.ui-tabs__tab:hover:not(:disabled) { color: var(--tabs-text-active, var(--text, var(--shell-text))); }
.ui-tabs__tab.is-active { color: var(--tabs-text-active, var(--text, var(--shell-text))); }
.ui-tabs__tab:disabled { opacity: 0.45; cursor: not-allowed; }
.ui-tabs__tab:focus-visible {
  outline: 2px solid var(--tabs-accent, var(--brand-accent, var(--accent)));
  outline-offset: -2px;
}

.ui-tabs--fill .ui-tabs__tab { flex: 1 1 0; min-width: 0; }

/* The single moving indicator. Positioned from the measured active tab
   (transform + width/height set inline by Tabs.jsx). */
.ui-tabs__indicator {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 0;
  pointer-events: none;
  will-change: transform, width;
}
.ui-tabs.is-ready .ui-tabs__indicator {
  transition:
    transform var(--motion-tab-duration, 340ms) var(--motion-ease-out, ease),
    width var(--motion-tab-duration, 340ms) var(--motion-ease-out, ease),
    height var(--motion-tab-duration, 340ms) var(--motion-ease-out, ease),
    opacity var(--motion-fast, 180ms) ease;
}

/* "Explored" dot — tabs the user has already opened (Tabs markVisited). */
.ui-tabs__dot {
  position: absolute;
  top: 7px;
  right: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--tabs-dot, var(--brand-accent, var(--accent)));
  opacity: 0.8;
  pointer-events: none;
  animation: ui-tabs-dot-in var(--motion-medium, 260ms) var(--motion-ease-out, ease) both;
}
.ui-tabs--sm .ui-tabs__dot { top: 4px; right: 4px; width: 4px; height: 4px; }
@keyframes ui-tabs-dot-in {
  from { transform: scale(0); opacity: 0; }
}
.ui-tabs__sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- underline (default) ---------- */
.ui-tabs--underline {
  box-shadow: inset 0 -1px 0 var(--tabs-line, var(--border-soft, var(--border, var(--shell-border-soft))));
}
.ui-tabs--underline .ui-tabs__indicator {
  top: auto;
  bottom: 0;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--tabs-accent, var(--brand-accent, var(--accent)));
}
.ui-tabs--underline .ui-tabs__tab { border-radius: 6px 6px 0 0; }
.ui-tabs__trailing {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
}

/* "N/M explored" count — part of every tab bar (Tabs showCount). */
.ui-tabs__count {
  font-family: var(--font-sans);
  font-size: 12px;
  letter-spacing: 0;
  white-space: nowrap;
  color: var(--tabs-count-text, var(--text-dimmer, var(--shell-text-dimmer)));
  font-variant-numeric: tabular-nums;
}
.ui-tabs__count b {
  font-weight: 600;
  color: var(--tabs-dot, var(--brand-accent, var(--accent)));
}
.ui-tabs--sm .ui-tabs__count { font-size: 11px; }
/* Narrow full-width bars (tour gear panels): number only, so labels keep
   their room — the title tooltip still says "N of M tabs explored". */
.ui-tabs--fill.ui-tabs--sm .ui-tabs__count-word { display: none; }
@media (max-width: 600px) {
  .ui-tabs__count-word { display: none; }
}

/* ---------- segmented (compact tool bars: DAW, tour gear panels) -------
   The track is the list itself (so the explored count can sit outside it). */
.ui-tabs--segmented { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; }
.ui-tabs--segmented.ui-tabs--fill { display: flex; }
.ui-tabs--segmented:not(.ui-tabs--fill) .ui-tabs__list { flex: 0 1 auto; }
.ui-tabs--segmented .ui-tabs__list {
  gap: 2px;
  padding: 3px;
  border-radius: 9px;
  background: var(--tabs-track-bg, rgba(127, 127, 127, 0.1));
  border: 1px solid var(--tabs-track-border, var(--border-soft, var(--border, var(--shell-border-soft))));
}
.ui-tabs--segmented .ui-tabs__trailing { padding-bottom: 0; }
.ui-tabs--segmented .ui-tabs__tab { --tabs-pad-y: 7px; --tabs-pad-x: 12px; border-radius: 6px; }
.ui-tabs--segmented .ui-tabs__tab.is-active {
  color: var(--tabs-thumb-text, var(--brand-accent, var(--tabs-text-active, var(--text, var(--shell-text)))));
}
.ui-tabs--segmented .ui-tabs__indicator {
  border-radius: 6px;
  background: var(--tabs-thumb-bg, color-mix(in srgb, var(--brand-accent, var(--accent)) 14%, transparent));
  box-shadow:
    inset 0 0 0 1px var(--tabs-thumb-border, color-mix(in srgb, var(--brand-accent, var(--accent)) 45%, transparent)),
    0 1px 2px rgba(0, 0, 0, 0.12);
}

/* ---------- sizes ---------- */
.ui-tabs--sm .ui-tabs__tab {
  --tabs-pad-y: 6px;
  --tabs-pad-x: 10px;
  font-size: var(--tabs-font-size, 12px);
}
.ui-tabs--sm.ui-tabs--segmented .ui-tabs__tab { --tabs-pad-y: 5px; --tabs-pad-x: 10px; }

/* ---------- panel ---------- */
.ui-tabpanel-clip { overflow-x: clip; min-width: 0; }
.ui-tabpanel:focus { outline: none; }
.ui-tabpanel:focus-visible {
  outline: 2px solid var(--tabs-accent, var(--brand-accent, var(--accent)));
  outline-offset: -2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  .ui-tabs.is-ready .ui-tabs__indicator,
  .ui-tabs__tab { transition: none; }
  .ui-tabs__dot { animation: none; }
}


  /* ======================================================================
     LAB — .sch ("studio components, horizontal")
     ====================================================================== */
  .sch{
    --scl-amber:#e8934a; --scl-green:#5fd9a0; --scl-blue:#6fa8e0; --scl-purple:#a78bfa;
    --sch-well:rgba(0,0,0,0.28);
  }
  :root[data-theme='light'] .sch{
    --scl-amber:#c96f24; --scl-green:#1f9a67; --scl-blue:#2f72b8; --scl-purple:#6d4fd6;
    --sch-well:rgba(var(--ink-tint-rgb),0.05);
  }
  .sch-tone-amber{--c:var(--scl-amber);}
  .sch-tone-green{--c:var(--scl-green);}
  .sch-tone-blue{--c:var(--scl-blue);}
  .sch-tone-purple{--c:var(--scl-purple);}

  /* Row 1 — section tab content (renderTab). Only the CONTENT is styled;
     .ui-tabs__* rules are untouched. */
  .sch-st{display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left;}
  .sch-st-room{font-size:11px; font-weight:600; line-height:1; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dimmer);}
  .sch-st-type{display:flex; align-items:baseline; gap:7px;}
  .sch-st-n{font:600 11px/1 var(--font-mono); color:var(--c);}
  .ui-tabs__tab.is-active .sch-st-room{color:var(--brand-accent);}

  /* Row 2 — component rail */
  .sch-rail{margin-top:18px;}
  .sch-rail-ic{width:14px; height:14px; flex:none;}

  /* Row 3 — panel */
  .sch-panel{padding-top:24px;}
  .sch-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:24px;}
  .sch-frame{
    position:relative; aspect-ratio:16/9; max-height:440px; width:100%; border-radius:12px; overflow:hidden;
    background:var(--sch-well); border:1px solid var(--border-soft);
  }
  .sch-frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .sch-ph{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:var(--c); border:1.5px dashed var(--border); border-radius:12px;
    background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--c) 9%, transparent), transparent 70%);
  }
  .sch-ph svg{width:56px; height:56px; opacity:.9;}
  .sch-ph span{font-size:12px; color:var(--text-dimmer);}
  .sch-caption{margin-top:10px; font-size:13px; color:var(--text-dimmer);}

  .sch-title{font-size:24px; font-weight:600; line-height:1.2; letter-spacing:-.01em; margin:0 0 8px;}
  .sch-lead{font-size:16px; line-height:1.6; color:var(--text); margin:0 0 14px;}
  .sch-body{font-size:15px; line-height:1.7; color:var(--text-dim); margin:0 0 12px;}
  .sch-body strong{color:var(--text); font-weight:600;}


  /* Row 4 — pager */
  .sch-pager{display:flex; align-items:center; gap:12px; margin-top:28px; padding-bottom:18px; border-bottom:1px solid var(--border-soft);}
  .sch-pager button{
    flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding:10px 14px; text-align:left;
    background:var(--panel); border:1px solid var(--border-soft); border-radius:10px; cursor:pointer;
    font-size:14px; font-weight:500; color:var(--text-dim);
    transition:color var(--motion-fast) ease, border-color var(--motion-fast) ease, background var(--motion-fast) ease;
  }
  .sch-pager button:last-child{text-align:right; align-items:flex-end;}
  .sch-pager button:hover:not(:disabled){color:var(--text); border-color:color-mix(in srgb, var(--brand-accent-2) 60%, transparent); background:var(--panel-hover);}
  .sch-pager button:focus-visible{outline:2px solid var(--brand-accent); outline-offset:2px;}
  .sch-pager button:disabled{opacity:.4; cursor:default;}
  .sch-pager small{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dimmer);}
  .sch-pager button:hover:not(:disabled) small{color:var(--brand-accent);}
  .sch-pager .nm{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  @media (max-width:820px){
    .course-col{padding:28px 16px 56px;}
    .sch-grid{gap:20px;}
      .sch-title{font-size:21px;}
  }
</style>

<div class="mock-bar" aria-label="Mockup controls">
  <span><b>Mockup</b> · Key Elements — horizontal alternate</span>
  <span class="sp"></span>
  <label>Palette <select id="palSel"></select></label>
  <button type="button" id="themeBtn">Light theme</button>
</div>

<div class="svr-course">
  <div class="course-col">
    <div class="lesson-eyebrow">Foundations · Ch. 02 · Interactive</div>
    <h2 class="lesson-h">Key Elements of the Recording Space</h2>
    <p class="lesson-sub">Sixteen things you'll find across the control room and the live room. Pick an area, then open each component.</p>

    <div class="lab sch" id="lab">

<script>
/* ---- data: generated verbatim from studioComponentsData.js ---- */
// Content for the "Studio Components" briefing lab (StudioComponentsLab.jsx).
// Structure and ids from design/studio-components-chapter.html's SECTIONS;
// the copy has been rewritten in plain, beginner-level language (this is
// many students' first look inside a studio) — short sentences, jargon
// avoided or explained on first use. Keep new copy at that level.
//
// Four sections — Control Room / Recording Room × Electronic /
// Non-electronic — of four components each. Each item:
//   id     — also the icon key (ICONS below) and the image file name
//            (see componentImagePath)
//   name   — display name
//   lead   — one-line definition
//   body   — paragraphs; **double asterisks** mark bold runs (rendered as
//            <strong> by StudioComponentsLab's renderRich, so this file
//            stays plain data with no JSX/HTML strings)
//   points — key points
//
// `tone` picks the section's accent color from the --scl-* tokens in
// StudioComponentsLab.css (amber/green/blue/purple, with separate
// light-theme values), matching the mockup's per-section colors.

const SECTIONS = [
  {
    n: "01",
    room: "Control Room",
    type: "Electronic",
    tone: "amber",
    items: [
      {
        id: "console",
        name: "Mixing Console",
        lead: "The big desk where all the sounds come together.",
        body: [
          "Every microphone and instrument in the studio is connected to the mixing console. Each one gets its own **channel**, a column of knobs with a **slider (fader)** at the bottom.",
          "The engineer uses these controls to make each sound louder or quieter and to change how it sounds. Together, the channels make one finished **mix**.",
        ],
        points: [
          "One channel = one sound source, like a voice or a drum.",
          "The fader at the bottom controls how loud that sound is.",
          "The console blends everything into one song.",
        ],
      },
      {
        id: "monitors",
        name: "Studio Speakers (Monitors)",
        lead: "Special speakers that let you hear the recording exactly as it is.",
        body: [
          "Home speakers often add extra bass or sparkle to make music sound nicer. Studio speakers, called **monitors**, don't. They play the sound **honestly**, so you can hear any problems.",
          "The two speakers and the listener's head form a **triangle** with equal sides. Sitting in that spot gives the clearest picture of the sound.",
        ],
        points: [
          "Monitors show the real sound, good or bad.",
          "Sit in the triangle with the two speakers.",
          "Point the speakers at your ears.",
        ],
      },
      {
        id: "outboard",
        name: "Outboard Gear",
        lead: "Hardware boxes that change or improve the sound.",
        body: [
          "These are separate boxes that each do one job. Some make a quiet microphone signal **stronger**. Some keep volume **even**. Some change the **tone**, like more bass or more treble.",
          "They are stacked on shelves called **racks**, so they are easy to reach and connect.",
        ],
        points: [
          "Each box does one job to the sound.",
          "Racks hold many boxes in one place.",
          "Many of these jobs can also be done with software.",
        ],

const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const cssMs = (name, fb) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || fb;
const EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
const icon = (id, cls = "") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id] || ""}</svg>`;

/* --------------------------------------------------------------------
   Vanilla stand-in for src/components/Tabs — same DOM + class names
   (.ui-tabs, __list, __indicator, __tab.is-active, __dot, __trailing,
   __count), same behaviour: gliding indicator, explored dots, N/M count,
   roving tabindex with ←/→/Home/End.
   -------------------------------------------------------------------- */
function createTabs(host, opts) {
  const o = { variant: "underline", size: null, fill: false, ...opts };
  let items = [], value = null, visited = new Set();
  const root = document.createElement("div");
  root.className = ["ui-tabs", `ui-tabs--${o.variant}`, o.size && `ui-tabs--${o.size}`, o.fill && "ui-tabs--fill"].filter(Boolean).join(" ");
  root.innerHTML = `<div class="ui-tabs__list" role="tablist"><span class="ui-tabs__indicator" aria-hidden="true"></span></div>
    <div class="ui-tabs__trailing"><span class="ui-tabs__count" aria-live="polite"></span></div>`;
  host.appendChild(root);
  const list = root.querySelector(".ui-tabs__list");
  const ind = root.querySelector(".ui-tabs__indicator");
  const count = root.querySelector(".ui-tabs__count");

  function place() {
    const t = list.querySelector(".ui-tabs__tab.is-active");
    if (!t) return;
    const x = t.offsetLeft;
    ind.style.width = t.offsetWidth + "px";
    if (o.variant === "segmented") { ind.style.height = t.offsetHeight + "px"; ind.style.transform = `translate(${x}px, ${t.offsetTop}px)`; }
    else ind.style.transform = `translateX(${x}px)`;
    const l = list.scrollLeft, r = l + list.clientWidth;
    if (x < l || x + t.offsetWidth > r) list.scrollTo({ left: x - 16, behavior: reduced() ? "auto" : "smooth" });
  }
  function paint() {
    list.querySelectorAll(".ui-tabs__tab").forEach((b) => b.remove());
    items.forEach((it) => {
      const sel = it.id === value;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ui-tabs__tab" + (sel ? " is-active" : "") + (it.tabClass ? " " + it.tabClass : "");
      b.id = `${o.idPrefix}-tab-${it.id}`;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", sel);
      b.setAttribute("aria-controls", "panel");
      b.tabIndex = sel ? 0 : -1;
      b.innerHTML = (o.renderTab ? o.renderTab(it, sel) : it.label) +
        (visited.has(it.id) && !sel ? `<span class="ui-tabs__dot" aria-hidden="true"></span><span class="ui-tabs__sr">(explored)</span>` : "");
      b.addEventListener("click", () => o.onChange(it.id));
      list.appendChild(b);
    });
    const n = items.filter((t) => visited.has(t.id)).length;
    count.title = `${n} of ${items.length} tabs explored`;
    count.innerHTML = `<b>${n}</b>/${items.length}<span class="ui-tabs__count-word"> explored</span>`;
    place();
  }
  list.addEventListener("keydown", (e) => {
    const i = items.findIndex((t) => t.id === value);
    let j = null;
    if (e.key === "ArrowRight") j = (i + 1) % items.length;
    else if (e.key === "ArrowLeft") j = (i - 1 + items.length) % items.length;
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = items.length - 1;
    if (j == null) return;
    e.preventDefault();
    o.onChange(items[j].id);
    list.querySelector(".ui-tabs__tab.is-active")?.focus();
  });
  addEventListener("resize", place);
  document.fonts?.ready.then(place);
  list.setAttribute("aria-label", o.ariaLabel);
  return {
    set(next) {
      if (next.items) items = next.items;
      if (next.visited) visited = next.visited;
      if (next.value != null) value = next.value;
      if (next.ariaLabel) list.setAttribute("aria-label", next.ariaLabel);
      paint();
      requestAnimationFrame(() => root.classList.add("is-ready"));
    },
    place,
  };
}

/* ---- panel motion: fade + 10px slide in direction of travel, height eases ---- */
const clip = document.getElementById("panelClip");
const panel = document.getElementById("panel");
function swapPanel(html, dir) {
  const from = clip.getBoundingClientRect().height;
  const fromOpacity = panel.getAnimations().length ? parseFloat(getComputedStyle(panel).opacity) : 0;
  clip.getAnimations().forEach((a) => a.cancel());
  panel.getAnimations().forEach((a) => a.cancel());
  panel.innerHTML = html;
  if (reduced() || from === 0) return;
  const to = clip.getBoundingClientRect().height;
  const dur = cssMs("--motion-panel-duration", 440), shift = cssMs("--motion-panel-shift", 10);
  panel.animate([{ opacity: fromOpacity, transform: `translate3d(${dir * shift}px, ${dir ? 0 : 6}px, 0)` }, { opacity: 1, transform: "none" }], { duration: dur, easing: EASE });
  if (Math.abs(to - from) > 1) {
    clip.style.overflow = "hidden";
    const a = clip.animate([{ height: from + "px" }, { height: to + "px" }], { duration: dur, easing: EASE });
    a.onfinish = a.oncancel = () => (clip.style.overflow = "");
  }
}

/* ---- lab state ---- */
let selectedId = ALL_COMPONENTS[0].id;
let lastSection = null;
const viewed = new Set([selectedId]);
const visitedSections = new Set([SECTIONS[0].n]);

const secTabs = createTabs(document.getElementById("secTabs"), {
  ariaLabel: "Studio areas",
  idPrefix: "sch-sec",
  renderTab: (it) =>
    `<span class="sch-st sch-tone-${it.s.tone}"><span class="sch-st-room">${it.s.room}</span>` +
    `<span class="sch-st-type">${it.s.type}</span></span>`,
  onChange: (n) => {
    const s = SECTIONS.find((x) => x.n === n);
    // Opening a section lands on its first unopened component (or the first).
    const target = s.items.find((it) => !viewed.has(it.id)) || s.items[0];
    select(target.id);
  },
});

const itemTabs = createTabs(document.getElementById("itemTabs"), {
  variant: "segmented",
  size: "sm",
  idPrefix: "sch-item",
  renderTab: (it) => `${icon(it.id, "sch-rail-ic")}<span>${it.label}</span>`,
  onChange: (id) => select(id),
});

function render(dir) {
  const index = ALL_COMPONENTS.findIndex((c) => c.id === selectedId);
  const item = ALL_COMPONENTS[index];
  const s = item.section;
  const prev = ALL_COMPONENTS[index - 1], next = ALL_COMPONENTS[index + 1];

  secTabs.set({
    items: SECTIONS.map((x) => ({ id: x.n, label: x.type, s: x })),
    value: s.n,
    visited: visitedSections,
  });
  // Second level: new area → component bar fades + slides in from the side of travel.
  if (lastSection !== s.n) {
    const host = document.getElementById("itemTabs");
    if (lastSection && !reduced()) {
      const d = Math.sign(SECTIONS.indexOf(s) - SECTIONS.findIndex((x) => x.n === lastSection));
      host.getAnimations().forEach((x) => x.cancel());
      host.animate([{ opacity: 0, transform: `translate3d(${d * cssMs("--motion-panel-shift", 10)}px,0,0)` }, { opacity: 1, transform: "none" }],
        { duration: cssMs("--motion-panel-duration", 440), easing: EASE });
    }
    lastSection = s.n;
  }
  itemTabs.set({
    items: s.items.map((it) => ({ id: it.id, label: it.name, tabClass: `sch-tone-${s.tone}` })),
    value: item.id,
    visited: new Set(s.items.filter((it) => viewed.has(it.id)).map((it) => it.id)),
    ariaLabel: `${s.room} — ${s.type} components`,
  });
  panel.setAttribute("aria-labelledby", `sch-item-tab-${item.id}`);
  panel.className = `ui-tabpanel sch-panel sch-tone-${s.tone}`;

  const img = `/studio-components/${item.id}.jpg`;
  swapPanel(`
    <div class="sch-grid">
      <figure style="margin:0">
        <div class="sch-frame">
          <img src="../public${img}" alt="${item.name}" onload="this.nextElementSibling.remove()" onerror="this.remove()">
          <div class="sch-ph">${icon(item.id)}<span>public${img}</span></div>
        </div>
        <figcaption class="sch-caption">${item.name} · ${s.room}</figcaption>
      </figure>
      <div>
        <h3 class="sch-title">${item.name}</h3>
        <p class="sch-lead">${item.lead}</p>
        ${item.body.map((p) => `<p class="sch-body">${rich(p)}</p>`).join("")}
      </div>
    </div>`, dir);

  const pb = document.getElementById("prevBtn"), nb = document.getElementById("nextBtn");
  pb.disabled = !prev; nb.disabled = !next;
  pb.querySelector(".nm").textContent = prev ? prev.name : "—";
  nb.querySelector(".nm").textContent = next ? next.name : "—";
  pb.onclick = () => prev && select(prev.id);
  nb.onclick = () => next && select(next.id);
}

function select(id) {
  if (id === selectedId) return;
  const from = ALL_COMPONENTS.findIndex((c) => c.id === selectedId);
  const to = ALL_COMPONENTS.findIndex((c) => c.id === id);
  selectedId = id;
  viewed.add(id);
  visitedSections.add(ALL_COMPONENTS[to].section.n);
  render(Math.sign(to - from));
}

  html.style.setProperty("--brand-accent-2", (html.dataset.theme === "dark" ? p.a2 : p.a2l) || p.dark);
}

  html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
  e.target.textContent = html.dataset.theme === "dark" ? "Light theme" : "Dark theme";
  applyPalette();
};
